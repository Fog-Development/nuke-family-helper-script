name: UI tests

# Runs the Playwright harness (see test/README.md): the script is injected into
# sanitized captures of real Torn pages, with Torn's committed CSS, in light and
# dark mode. No network access to Torn is needed.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser download is the slow part. Cache it per Playwright version
      # (package-lock.json changes whenever that version does).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System libraries live outside the cached directory, so they are
      # installed on every run (browser binaries are already in place).
      - name: Install system libraries only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        run: npm test

      # Screenshots of every themed render, for inspecting failures.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: test/screenshots/
          if-no-files-found: ignore
          retention-days: 7
