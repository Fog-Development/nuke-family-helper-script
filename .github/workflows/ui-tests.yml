name: UI tests

# Runs the Playwright harness (see test/README.md): the script is injected into
# captures of real Torn pages (a private repository), with Torn's CSS, in light and
# dark mode. No network access to Torn is needed.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The captured pages are in a private repository (test/README.md). With
      # a FIXTURES_TOKEN secret (read access to it) the page tests run and
      # must find it; without one only the unit and recorder tests run.
      HAS_FIXTURES: ${{ secrets.FIXTURES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the private fixtures
        if: env.HAS_FIXTURES == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FIXTURES_REPO || 'Fog-Development/nuke-family-helper-fixtures' }}
          token: ${{ secrets.FIXTURES_TOKEN }}
          path: fixtures

      - name: Require the fixtures
        if: env.HAS_FIXTURES == 'true'
        run: echo "NFH_REQUIRE_FIXTURES=1" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser download is the slow part. Cache it per Playwright version
      # (package-lock.json changes whenever that version does).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System libraries live outside the cached directory, so they are
      # installed on every run (browser binaries are already in place).
      - name: Install system libraries only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        run: npm test

      # Screenshots of every themed render, for inspecting failures.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: test/screenshots/
          if-no-files-found: ignore
          retention-days: 7
